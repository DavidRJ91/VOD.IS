name: Procesar VOD

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: "Enlace del VOD (Twitch o Kick)"
        required: true
      title:
        description: "Título en YouTube (vacío = usar el original)"
        required: false
        default: ""
      description:
        description: "Descripción en YouTube (vacío = usar la original)"
        required: false
        default: ""
      privacy:
        description: "Visibilidad"
        required: true
        default: "unlisted"
        type: choice
        options:
          - "public"
          - "unlisted"
          - "scheduled"
      scheduled_at:
        description: "Fecha/hora UTC si es programado (AAAA-MM-DDTHH:MM:SSZ)"
        required: false
        default: ""
      quality:
        description: "Calidad máxima de descarga"
        required: false
        default: "1080"
        type: choice
        options:
          - "720"
          - "1080"
          - "best"
      thumbnail_url:
        description: "URL directa a una imagen JPG/PNG (máx. 2MB) para portada. Vacío = se extrae un fotograma del propio VOD."
        required: false
        default: ""
      thumbnail_timestamp:
        description: "Instante del VOD para la miniatura si no das una URL (HH:MM:SS, o 'auto' = mitad del vídeo)"
        required: false
        default: "auto"
      thumbnail_repo_path:
        description: "Uso interno: ruta en el repo de una miniatura subida desde la web (se lee y se borra al terminar)."
        required: false
        default: ""
      clip_count:
        description: "Cuántos clips de ~30s crear a partir del VOD (0 = ninguno)"
        required: false
        default: "0"

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      VOD_URL: ${{ inputs.vod_url }}
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DESCRIPTION: ${{ inputs.description }}
      PRIVACY: ${{ inputs.privacy }}
      SCHEDULED_AT: ${{ inputs.scheduled_at }}
      QUALITY: ${{ inputs.quality }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
      THUMBNAIL_TIMESTAMP: ${{ inputs.thumbnail_timestamp }}
      THUMBNAIL_REPO_PATH: ${{ inputs.thumbnail_repo_path }}
      CLIP_COUNT: ${{ inputs.clip_count }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar VOD
        run: python scripts/step_download.py

      - name: Preparar miniatura
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_thumbnail.py

      - name: Subir a YouTube
        run: python scripts/step_upload.py

      - name: Crear clips
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_clips.py

      - name: Publicar resultado
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_publish_result.py

      - name: Notificar éxito
        if: success()
        run: python scripts/step_notify.py success

      - name: Notificar fallo
        if: failure()
        run: python scripts/step_notify.py failure

      - name: Borrar miniatura subida
        if: always()
        uses: actions/github-script@v7
        env:
          THUMBNAIL_CLEANUP_PATH: ${{ inputs.thumbnail_repo_path }}
        with:
          script: |
            const path = process.env.THUMBNAIL_CLEANUP_PATH;
            if (!path) return;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
              });
              await github.rest.repos.deleteFile({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: `chore: limpiar miniatura temporal (${path})`,
                sha: data.sha,
              });
              console.log(`Miniatura temporal borrada: ${path}`);
            } catch (err) {
              console.log(`Aviso: no se pudo borrar la miniatura temporal (${err.message})`);
            }
