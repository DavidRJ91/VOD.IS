name: Procesar VOD

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué procesar"
        required: true
        default: "vod"
        type: choice
        options:
          - "vod"
          - "live_simple"
          - "live_chunked"
      vod_url:
        description: "Enlace del VOD (Twitch o Kick) — solo para mode=vod"
        required: false
        default: ""
      live_channel_url:
        description: "Enlace del canal de Twitch EN DIRECTO — solo para mode=live_simple o live_chunked"
        required: false
        default: ""
      chunk_minutes:
        description: "Minutos por parte en modo 'por partes' (mode=live_chunked)"
        required: false
        default: "25"
      title:
        description: "Título en YouTube (vacío = usar el original)"
        required: false
        default: ""
      description:
        description: "Descripción en YouTube (vacío = usar la original)"
        required: false
        default: ""
      privacy:
        description: "Visibilidad"
        required: true
        default: "unlisted"
        type: choice
        options:
          - "public"
          - "unlisted"
          - "scheduled"
      scheduled_at:
        description: "Fecha/hora UTC si es programado (AAAA-MM-DDTHH:MM:SSZ)"
        required: false
        default: ""
      quality:
        description: "Calidad máxima de descarga"
        required: false
        default: "1080"
        type: choice
        options:
          - "720"
          - "1080"
          - "best"
      trim_start:
        description: "Recortar el VOD desde este instante (HH:MM:SS). Solo mode=vod. Vacío = desde el principio."
        required: false
        default: ""
      trim_end:
        description: "Recortar el VOD hasta este instante (HH:MM:SS). Solo mode=vod. Vacío = hasta el final."
        required: false
        default: ""
      playlist_id:
        description: "ID de una lista de reproducción de YouTube a la que añadir el vídeo (opcional)"
        required: false
        default: ""
      thumbnail_url:
        description: "URL directa a una imagen JPG/PNG (máx. 2MB) para portada. Vacío = se extrae un fotograma del propio VOD."
        required: false
        default: ""
      thumbnail_timestamp:
        description: "Instante del VOD para la miniatura si no das una URL (HH:MM:SS, o 'auto' = mitad del vídeo)"
        required: false
        default: "auto"
      thumbnail_repo_path:
        description: "Uso interno: ruta en el repo de una miniatura subida desde la web (se lee y se borra al terminar)."
        required: false
        default: ""
      clip_count:
        description: "Cuántos clips crear a partir del VOD, repartidos automáticamente (0 = ninguno; se ignora si rellenas clip_timestamps). Solo mode=vod o live_simple."
        required: false
        default: "0"
      clip_timestamps:
        description: "Marcas de tiempo manuales para los clips, separadas por comas (ej. 5:30, 12:45, 90). Si rellenas esto, tiene prioridad sobre clip_count."
        required: false
        default: ""
      clip_duration:
        description: "Duración de cada clip, en segundos"
        required: false
        default: "30"
        type: choice
        options:
          - "15"
          - "30"
          - "60"

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      MODE: ${{ inputs.mode }}
      VOD_URL: ${{ inputs.vod_url }}
      LIVE_CHANNEL_URL: ${{ inputs.live_channel_url }}
      CHUNK_MINUTES: ${{ inputs.chunk_minutes }}
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_DESCRIPTION: ${{ inputs.description }}
      PRIVACY: ${{ inputs.privacy }}
      SCHEDULED_AT: ${{ inputs.scheduled_at }}
      QUALITY: ${{ inputs.quality }}
      TRIM_START: ${{ inputs.trim_start }}
      TRIM_END: ${{ inputs.trim_end }}
      PLAYLIST_ID: ${{ inputs.playlist_id }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
      THUMBNAIL_TIMESTAMP: ${{ inputs.thumbnail_timestamp }}
      THUMBNAIL_REPO_PATH: ${{ inputs.thumbnail_repo_path }}
      CLIP_COUNT: ${{ inputs.clip_count }}
      CLIP_TIMESTAMPS: ${{ inputs.clip_timestamps }}
      CLIP_DURATION: ${{ inputs.clip_duration }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar VOD
        if: inputs.mode == 'vod'
        run: python scripts/step_download.py

      - name: Recortar VOD
        if: inputs.mode == 'vod'
        run: python scripts/step_trim.py

      - name: Grabar directo (completo)
        if: inputs.mode == 'live_simple'
        run: python scripts/step_live_record_simple.py

      - name: Preparar miniatura
        if: inputs.mode == 'vod' || inputs.mode == 'live_simple'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_thumbnail.py

      - name: Subir a YouTube
        if: inputs.mode == 'vod' || inputs.mode == 'live_simple'
        run: python scripts/step_upload.py

      - name: Crear clips
        if: success() && (inputs.mode == 'vod' || inputs.mode == 'live_simple')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_clips.py

      - name: Grabar y subir directo por partes
        if: inputs.mode == 'live_chunked'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_live_record_chunked.py

      - name: Publicar resultado
        if: success() && inputs.mode != 'live_chunked'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_publish_result.py

      - name: Notificar éxito
        if: success() && inputs.mode != 'live_chunked'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_notify.py success

      - name: Notificar fallo
        if: failure() && inputs.mode != 'live_chunked'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/step_notify.py failure

      - name: Borrar miniatura subida
        if: always()
        uses: actions/github-script@v7
        env:
          THUMBNAIL_CLEANUP_PATH: ${{ inputs.thumbnail_repo_path }}
        with:
          script: |
            const path = process.env.THUMBNAIL_CLEANUP_PATH;
            if (!path) return;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
              });
              await github.rest.repos.deleteFile({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: `chore: limpiar miniatura temporal (${path})`,
                sha: data.sha,
              });
              console.log(`Miniatura temporal borrada: ${path}`);
            } catch (err) {
              console.log(`Aviso: no se pudo borrar la miniatura temporal (${err.message})`);
            }
